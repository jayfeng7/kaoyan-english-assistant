name: Feature request
description: 提议新功能或体验改进
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认提议不包含登录、支付、服务端用户数据库、多租户或未授权的真题内容。
        大功能请先描述问题与验证方式，不要直接提交大范围重写。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 作文批改
        - 长难句
        - 真题解析
        - 聊天/追问
        - 历史/存储
        - 部署/安全
        - 文档/开源
        - 其他
  - type: textarea
    id: verification
    attributes:
      label: 如何验证
      description: 说明自动测试、人工验收、数据范围和失败判据。
